openapi: 3.1.0
info:
  title: Locations Module
  version: 1.0.0
paths:
  /api/locations:
    get:
      summary: Get all locations
      tags:
        - Locations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Berhasil mengambil daftar lokasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Locations retrieved successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        code:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        isActive:
                          type: boolean

    post:
      summary: Create location baru (ADMIN)
      tags:
        - Locations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  example: "RAK-A1"
                name:
                  type: string
                  example: "Rak Sektor A1"
                description:
                  type: string
                  example: "Area penyimpanan komparlemen A"
      responses:
        '201':
          description: Lokasi berhasil dibuat